```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Intern Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="create-container">

    <div class="create-card">

        <a href="/logout" class="back-link">← Back</a>

        <h1>NEW INTERN ACCOUNT</h1>

        <p class="subtitle">
            Create your profile so employers can find and review your information.
        </p>

        <form action="/create-account" method="POST" enctype="multipart/form-data">

            <label for="firstname">First Name</label>
            <input
                type="text"
                name="firstname"
                id="firstname"
                placeholder="e.g. Jane"
                required
            >

            <label for="lastname">Last Name</label>
            <input
                type="text"
                name="lastname"
                id="lastname"
                placeholder="e.g. Smith"
                required
            >

            <label for="email">Email</label>
            <input
                type="text"
                name="email"
                id="email"
                placeholder="e.g. jane@conatix.com"
                required
            >

            <label for="actual_role">Role</label>
            <input
                type="text"
                name="actual_role"
                id="actual_role"
                placeholder="e.g. software intern"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                name="password"
                id="password"
                required
            >

            <label>Headshot</label>

            <div class="upload-area">

                <label class="upload-button">

                    Upload Photo

                    <input
                        type="file"
                        name="headshot"
                        id="headshot"
                        accept="image/*"
                        hidden
                        required
                    >

                </label>

                <p id="headshot-name"></p>

            </div>


            <label>CV / Resume</label>

            <label class="upload-button full">

                Upload Resume

                <input
                    type="file"
                    name="resume"
                    id="resume"
                    accept=".pdf,.doc,.docx"
                    hidden
                    required
                >

            </label>

            <p id="resume-name"></p>


            <button class="login-btn" type="submit">
                Create Account
            </button>

        </form>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>
    const headshotInput = document.getElementById("headshot");
    const resumeInput = document.getElementById("resume");

    const headshotName = document.getElementById("headshot-name");
    const resumeName = document.getElementById("resume-name");

    headshotInput.addEventListener("change", function () {
        headshotName.textContent = this.files[0]
            ? this.files[0].name
            : "";
    });

    resumeInput.addEventListener("change", function () {
        resumeName.textContent = this.files[0]
            ? this.files[0].name
            : "";
    });
</script>

</body>
</html>
```
